services:
  mysql-db:
    image: mysql:8.0
    container_name: janos_mysql
    environment:   
      MYSQL_ROOT_PASSWORD: root       # Senha padrão de desenvolvimento
    
    ports:
      - "3306:3306"                    # Mapeia a porta do container para o seu Linux
    volumes:
      - mysql_data:/var/lib/mysql 
      - ./infra-database/init.sql:/docker-entrypoint-initdb.d/init.sql   
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  servico-usuario:
    build: 
      context: .
      dockerfile: usuario/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      mysql-db:
         condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/usuario
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    restart: on-failure
  servico-csvjson:
     build: 
       context: .
       dockerfile: CsvParaJson/Dockerfile
     ports:
      - "8080:8080"
  servico-manifesto:
       build:
         context: . 
         dockerfile: manifesto/Dockerfile
       ports:
        - "8082:8082"
       depends_on:
          mysql-db:
            condition: service_healthy
       environment:
          SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/manifesto
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
       restart: on-failure 
  servico-agregado:
      build:
        context: . 
        dockerfile: agregado/Dockerfile
      ports:
       - "8083:8083"
      depends_on:
        mysql-db:
            condition: service_healthy 
      environment:
          SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/agregado
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
      restart: on-failure
  servico-avaliacao:
        build: 
          context: . 
          dockerfile: avaliacao/Dockerfile 
        ports:
         - "8084:8084"
        depends_on:
            mysql-db: 
                condition: service_healthy 
        environment:
                  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/avaliacao
                  SPRING_DATASOURCE_USERNAME: root
                  SPRING_DATASOURCE_PASSWORD: root
        restart: on-failure 
  servico-motorista:
      build:
         context: . 
         dockerfile: motorista/Dockerfile
      ports:
        - "8085:8085"
      depends_on:
         mysql-db:
           condition: service_healthy
      environment:
                  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/motorista
                  SPRING_DATASOURCE_USERNAME: root
                  SPRING_DATASOURCE_PASSWORD: root
      restart: on-failure    
  service-veiculo:
       build:
         context: . 
         dockerfile: veiculo/Dockerfile
       ports:
         - "8086:8086"
       depends_on:
          mysql-db:
             condition: service_healthy
       environment:
                  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/veiculo
                  SPRING_DATASOURCE_USERNAME: root
                  SPRING_DATASOURCE_PASSWORD: root
       restart: on-failure    


    
  
    

volumes:
  mysql_data: