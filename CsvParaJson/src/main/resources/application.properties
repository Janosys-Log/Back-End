spring.application.name=CsvParaJson
spring.rabbitmq.template.reply-timeout=5m

# ===============================================
# JWT - o MESMO segredo precisa estar em todos os servicos.
# Docker: vem de APP_SECURITY_JWT_SECRET (compose le JWT_SECRET do .env).
# Fora do Docker (IDE/mvn): usa o JWT_SECRET do ambiente ou o padrao de DEV abaixo,
# que e igual ao do .env, evitando 401 por segredos diferentes entre servicos.
# ===============================================
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:${JWT_SECRET:7f9c2a8e4d1b6f3c9a0e5d8b2c7f1a6e4b9d3c0f8a2e5d7b1c6f9a4e3d8b2c5f}}
