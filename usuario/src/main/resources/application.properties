spring.application.name=usuario
server.port=8082

# ===============================================
# Configuração de Conexão com o Banco de Dados MySQL
# ===============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:janos_staged}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================================
# Configurações do Hibernate / JPA
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# ===============================================
# Credenciais do Administrador Primário (Bootstrap Seed)
# ===============================================
app.security.admin.nome=${ADMIN_NOME:Administrador Primário}
app.security.admin.email=${ADMIN_EMAIL:admin@janosys.com}
app.security.admin.password=${ADMIN_PASSWORD:Admin@123456}

# ===============================================
# Configurações do JWT
# ===============================================
app.security.jwt.secret=${JWT_SECRET:janosys-fleetops-super-secret-key-3-dsm-2026-fatec-sjc-seguranca-jwt-token}
app.security.jwt.expiration-ms=28800000

# ===============================================
# SpringDoc / Swagger
# ===============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

